name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Migration manifest
        run: npm run db:migrate:check

      - name: Lint
        run: npm run lint

      - name: Unit & guardrail tests
        run: npm test -- --ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Guard against committed secrets and data dumps
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.tar\.gz$|^backups/|^database/.*\.sql$'; then
            echo "::error::พบไฟล์ที่ห้าม commit (secret หรือไฟล์สำรองฐานข้อมูล)"
            exit 1
          fi
