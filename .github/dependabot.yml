# ตรวจไลบรารีที่มีช่องโหว่/มีรุ่นใหม่ แล้วเปิด Pull Request ให้อัตโนมัติ (ต้องตรวจและ merge เอง)
# เปิดใช้: GitHub › Settings › Code security › Dependabot alerts + security updates
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    groups:
      # รุ่นย่อย/แก้บั๊ก รวมเป็น PR เดียวต่อสัปดาห์ (รุ่นหลักแยก PR เพื่อตรวจทีละตัว)
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
